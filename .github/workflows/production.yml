name: Website production
on:
  workflow_run:
    workflows: [Website CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Manual rollback or one-time baseline bootstrap
        type: choice
        options: [rollback, bootstrap]
        default: rollback
        required: true
      source_sha:
        description: Full 40-character source SHA of a successful main push CI run
        required: true
        type: string
      ci_run_id:
        description: Exact successful Website CI run ID for that SHA
        required: true
        type: string
      expected_current:
        description: Current production SHA for manual rollback only
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  production:
    if: >-
      (github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' &&
       vars.QS_AUTO_CD_READY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       (inputs.action == 'rollback' ||
        (inputs.action == 'bootstrap' && vars.QS_AUTO_CD_READY != 'true')))
    concurrency:
      group: qs-production
      cancel-in-progress: false
      queue: max
    environment:
      name: qs-production
      url: https://quality-service-hair.165-245-223-138.sslip.io/
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select exact successful main CI artifact
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          QS_AUTO_CD_READY: ${{ vars.QS_AUTO_CD_READY }}
        run: |
          mkdir -p out
          python automation/select_ci.py --output out/selected
      - name: Promote or roll back, then verify HTTPS
        if: steps.select.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QS_DEPLOY_SSH_KEY: ${{ secrets.QS_DEPLOY_SSH_KEY }}
          QS_KNOWN_HOSTS: ${{ vars.QS_KNOWN_HOSTS }}
        run: python automation/deploy.py --artifact out/selected --report out/production-receipt
      - name: Preserve sanitized operation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/selected/selection.json
            out/production-receipt/
          if-no-files-found: warn
          retention-days: 30
